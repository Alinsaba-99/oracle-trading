# Oracle Trading — Backfill Plan
# Format: SYMBOL|TIMEFRAME|SOURCE|START_DATE|END_DATE(optional)
# Priority order: longest history first, then tighter timeframes.
# Orchestrator is idempotent — already-completed entries are skipped on re-run.
# Run (full):  python -m market.ingestion.orchestrator run
# Run (daily refresh, incremental):  python -m market.ingestion.cli run-plan --incremental
#   incremental fetches only bars newer than coverage latest; entries with an
#   explicit END_DATE always run their full configured range.
#
# BLOCKED sources (2026-07-31): histdata (token flow rotto, 404), stooq
# (anti-bot JS challenge), ibkr (TWS/Gateway non attivo), databento (serve
# DATABENTO_API_KEY). Le entry sono commentate in fondo; riattivarle quando
# le credenziali esistono. Coverage del piano live: 100% raggiungibile.
# NB: l'API Dukascopy jetta serve SOLO bucket chiusi (giorno/mese/anno
# corrente -> HTTP 400): il refresh porta 1m a ieri, 1h/4h a fine mese, 1d
# a fine anno precedente — comportamento atteso, non errore.

