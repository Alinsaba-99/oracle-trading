- id: EF-002
  nome: hrp-portfolio-allocation
  meccanismo: 'allocazione Hierarchical Risk Parity (clustering gerarchico sulle correlazioni)
    per il portafoglio dei candidati APPROVED: robusta OOS, senza inversione di matrice
    né stima rendimenti attesi'
  perche_esiste: le stime di rendimenti attesi sono fragili; HRP sfrutta solo la struttura
    di correlazione, più stabile (López de Prado 2016)
