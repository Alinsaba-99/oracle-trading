- id: EF-001
  nome: meta-labeling-sizing
  meccanismo: 'modello secondario (LightGBM) impara quando fidarsi del segnale primario:
    features = regime + volatilità + confidenza segnale → output = sizing; solo trade
    con meta-prob > soglia'
  perche_esiste: 'separa la predizione (recall) dal sizing (precision): migliora Sharpe
    senza inventare segnali nuovi (López de Prado 2018)'
