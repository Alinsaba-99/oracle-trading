- id: EF-004
  nome: cross-pillar-conditioning-overlay
  meccanismo: 'condizionamento NON direzionale delle gambe qualificate con segnali
    di altri pilastri KB: VIX z-score (05-sentiment) e funding-z (11-onchain) veto/scalano
    le posizioni trend quando il pilastro segnala rischio (stessa forma di Sprint
    2d: pos *= 1 - clip(|z|,0,2)/2)'
  perche_esiste: meta-labeling/conditioning separa side da size (Lopez de Prado 2018
    ch.3); l'edge vive nelle interazioni fra pilastri, non nei numeri singoli (direttiva
    Renaissance-parity 2026-09-04)
  origine: kb
  fonti:
