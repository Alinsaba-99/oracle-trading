- id: EF-003
  nome: hurst-regime-persistence
  meccanismo: Hurst exponent > 0.5 (persistent) → strategia trend-following sull'asset;
    < 0.5 → mean-reversion; stima rolling R/S su finestre 2-4 anni come router di
    strategia
  perche_esiste: long memory nei rendimenti è documentata e stabile OOS; il market
    microstructure genera autocorrelazione di segno opposto nei due regimi (Hurst
    1951; KB-09)
