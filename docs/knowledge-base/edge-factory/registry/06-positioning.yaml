- id: EF-002
  nome: cot-hedging-pressure-deroon
  meccanismo: 'hedging pressure (net commercial position normalizzato) forecasta rendimenti
    futures commodity: long i commodity con pressione hedger più corta'
  perche_esiste: i producer-hedger pagano un premio a chi assume il rischio opposto
    (theory of normal backwardation; De Roon et al 2000)
