- id: EF-003
  nome: open-interest-hong-yogo
  meccanismo: open interest in crescita con prezzo in crescita = trend sano; OI in
    calo su rally = short-covering fragile → segnale di uscita
  perche_esiste: 'l''interesse aperto misura l''impegno nuovo nel trend (Hong-Yogo
    2012): i rally senza nuovo OI sono chiusure di short, non posizionamento direzionale'
  origine: kb
