- id: EF-001
  nome: cot-smart-money-indicator
  meccanismo: SMI = posizionamento non-commercial relativo ai commercial; estremi
    commercial long → bottom market (long), estremi spec long crowded → caution. Long-or-flat
    su futures
  perche_esiste: 'gli hedger commerciano per business, gli speculatori ineriscono
    al momentum: gli estremi degli hedger catturano i turn (Bhansali 2014, edge +4-6%/yr
    dichiarato su commodity)'
  origine: kb
  fonti:
  - docs/knowledge-base/06-positioning/README.md
  effect_size_dichiarata: +4-6%/yr su commodity (Bhansali 2014, dichiarato dall'autore,
    pre-decay)
  decay_atteso_pct: 30.0
  dati_richiesti:
  - CFTC COT historical compressed (free, 1986+)
  - futures EOD (ES, GC, CL dal lake)
  dati_posseduti: null
  asset_candidati:
