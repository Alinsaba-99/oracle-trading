- id: EF-001
  nome: de-bondt-thaler-long-reversal
  meccanismo: 'long i 35 loser 3-5y (decile più svalutato), short i winner: i loser
    outperformano 3-5y dopo (asimmetrico, più forte a gennaio)'
  perche_esiste: 'overreaction: il mercato estrapola troppo i risultati passati e
    la correzione successiva genera il reversal (De Bondt-Thaler 1985)'
  origine: kb
