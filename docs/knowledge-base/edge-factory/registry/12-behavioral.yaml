- id: EF-002
  nome: dhs-overconfidence-underreaction
  meccanismo: 'dopo run di risultati positivi (management overconfident) gli earnings
    beat si allungano in drift più persistente: long i ticker con momentum fondamentale
    + beat consecutivi'
  perche_esiste: overconfidence + biased self-attribution rallenta l'aggiustamento
    dei prezzi (Daniel-Hirshleifer-Subrahmanyam 1998, BL-KB-105)
