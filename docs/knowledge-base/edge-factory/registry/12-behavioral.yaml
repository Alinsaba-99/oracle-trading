- id: EF-003
  nome: 52-week-high-anchoring
  meccanismo: 'prossimità al 52-week high (George-Hwang 2004): i titoli vicini al
    massimo annuale continuano a outperformare (anchoring bias: il massimo è visto
    come troppo caro)'
  perche_esiste: gli investitori ancorano al massimo storico recente e vendono troppo
    presto; l'aggiustamento avviene con drift
