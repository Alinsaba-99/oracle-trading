- id: EF-002
  nome: fft-spectral-cycle-detector
  meccanismo: spettro FFT dei rendimenti con picchi persistenti a periodi 40-200 giorni
    → timing entrata/uscita su quei periodi; se spettro piatto → nessun trade
  perche_esiste: alcuni asset mostrano periodicità debole ma misurabile; il filtro
    spettrale la quantifica senza le pretese soggettive di Elliott
