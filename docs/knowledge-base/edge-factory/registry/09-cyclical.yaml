- id: EF-001
  nome: hurst-rs-regime-router
  meccanismo: Hurst > 0.5 → asset persistent (alloca trend-following); < 0.5 → anti-persistent
    (alloca mean-reversion); router ricalcolato mensile su 3y rolling
  perche_esiste: la long memory è l'unico ciclo misurabile con rigore nel dominio
    (Hurst 1951); Elliott/Gann sono soggettivi e scartati, Kondratieff ha troppo poche
    osservazioni
  origine: kb
