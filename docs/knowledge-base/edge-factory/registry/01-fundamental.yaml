- id: EF-001
  nome: novy-marx-gross-profitability
  meccanismo: 'aziende con alto profitto lordo su asset (GPA) sottoperformano le attese:
    gross profitability è un fattore di qualità che predice rendimenti cross-sectional
    mensili oltre value'
  perche_esiste: costi di ingresso/uscita e vantaggi competitivi persistenti generano
    profitti stabili che il mercato sconta troppo lentamente (friction del capitale
    fisico)
  origine: kb
  fonti:
  - docs/knowledge-base/01-fundamental/README.md
  effect_size_dichiarata: documentata in Novy-Marx 2013 (gross profitability premium)
  decay_atteso_pct: 30.0
