- id: EF-003
  nome: sloan-accrual-anomaly
  meccanismo: 'aziende con accruals elevati (utile cash-flow < utile contabile) hanno
    rendimenti futuri inferiori: short high-accrual / long low-accrual, decili mensili'
  perche_esiste: gli investitori ancorano all'earnings totale e ignorano la componente
    accrual meno persistente (naive expectations)
  origine: kb
  fonti:
  - docs/knowledge-base/01-fundamental/README.md
  effect_size_dichiarata: non_quantificata
  decay_atteso_pct: 30.0
