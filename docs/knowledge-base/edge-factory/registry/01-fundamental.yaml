- id: EF-002
  nome: piotroski-fscore-value-long
  meccanismo: 'F-Score 9-flagge (ROA, accruals, leverage, margin...) dentro il decile
    value separa i value-trap dai recuperabili: long high-F value stocks, rebalance
    annuale'
  perche_esiste: mercato punisce troppo le azioni svalutate per inattenzione; i segnali
    contabili ravvicinano la correzione dell'underpricing
  origine: kb
  fonti:
