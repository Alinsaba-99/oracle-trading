- id: EF-003
  nome: cumulative-delta-trend-crypto
  meccanismo: 'cumulative delta (ask-bid volume) divergente dal prezzo segnala esaurimento
    dell''aggressione: price new-high + delta non-confirm → reversal atteso'
  perche_esiste: l'aggressione unilaterale esaurisce la liquidità disponibile; la
    divergenza indica che il movimento non ha più combustibile (footprint/Dalton framework)
  origine: kb
