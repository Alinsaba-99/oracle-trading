- id: EF-003
  nome: growth-inflation-4regime-allocation
  meccanismo: 'classificatore 4 regimi (growth↑↓ × inflation↑↑ su dati PIT) rialloca:
    stocks in growth↑infl↓, bonds in growth↓infl↓, commodities in growth↑infl↑, cash
    in growth↓infl↑'
  perche_esiste: ogni asset class incassa i flussi ottimali nel proprio regime macro
