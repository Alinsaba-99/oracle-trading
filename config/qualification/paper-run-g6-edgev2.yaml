# BL-615 / BL-024 — canonical qualifying paper run (reference spec).
#
# Usage:
#   oracle paper run --spec config/qualification/paper-run-g6-edgev2.yaml
#
# Reproduces the BL-024 qualifying setup (100 sessioni EdgeEnsembleV2
# nella catena paper completa, ES 1d dal lake). Il manifest emesso
# (hash dati, spec, seed, git commit) rende ogni verdetto riproducibile.
#
# Verdetto 2026-08-21: REJECTED (pass 0.35 < 0.90, mean DD 5.53% > 3%) —
# docs/reports/g6-wp2-final/bl024-edgev2-2026-08-21.md

schema_version: 1
name: g6-wp2-edgev2-qualifying
data: data/lake/normalized/symbol=ES/tf=1d/
instrument: MES
capital: 50000
sessions: 100
window: 95
ensemble: edge_v2
seed: 42
storage: null            # BL-060: postgres se un DSN è configurato, else memory
verify_pin: false
gate_pass_rate: 0.90
gate_mean_sharpe: -0.5
gate_mean_dd_pct: 3.0
output: logs/paper_canonical/g6-wp2-edgev2-qualifying.json
