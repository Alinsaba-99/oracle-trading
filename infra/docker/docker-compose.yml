# Oracle Trading Platform — Docker Compose
# Services: API, dashboard, scheduler, reconciliation worker
# Database: PostgreSQL (ledger/OMS)
# Cache: Redis (recoverable, non-authoritative)

services:
  # ── PostgreSQL (authoritative ledger/OMS store) ────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oracle-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    environment:
      POSTGRES_DB: oracle
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: ${ORACLE_DB_PASSWORD:-oracle_dev}
    ports:
      - "127.0.0.1:5432:5432"  # Localhost only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle -d oracle"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - oracle_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Redis (cache only — never source of truth) ────────────────────
  redis:
    image: redis:7-alpine
    container_name: oracle-redis
    restart: unless-stopped
    command: redis-server --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"  # Localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - oracle_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── FastAPI (control/read API) ───────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: oracle-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ORACLE_MODE: ${ORACLE_MODE:-research}
      ORACLE_API_KEY: ${ORACLE_API_KEY:-dev-key-change-me}
      ORACLE_DB_URL: postgresql+psycopg2://oracle:${ORACLE_DB_PASSWORD:-oracle_dev}@postgres:5432/oracle
      ORACLE_REDIS_URL: redis://redis:6379/0
      ORACLE_DEBUG: "${ORACLE_DEBUG:-true}"
    ports:
      - "127.0.0.1:8000:8000"  # Localhost only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - oracle_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Dashboard (React static served by API) ───────────────────────
  dashboard:
    build:
      context: apps/dashboard
      dockerfile: Dockerfile
    container_name: oracle-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"  # Localhost only
    networks:
      - oracle_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"

  # ── Scheduler (cron jobs: data refresh, reconciliation) ──────────
  scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    container_name: oracle-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORACLE_MODE: ${ORACLE_MODE:-research}
      ORACLE_API_KEY: ${ORACLE_API_KEY:-dev-key-change-me}
      ORACLE_DB_URL: postgresql+psycopg2://oracle:${ORACLE_DB_PASSWORD:-oracle_dev}@postgres:5432/oracle
    command: >
      sh -c "
      while true; do
        echo 'Running scheduled reconciliation...';
        uv run --frozen python -c 'from core.reconciliation import ReconciliationEngine; print(\"Reconciliation OK\")' 2>/dev/null || true;
        sleep 3600;
      done
      "
    networks:
      - oracle_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

volumes:
  postgres_data:
    driver: local

networks:
  oracle_net:
    driver: bridge
    internal: false  # External API port is explicitly bound to 127.0.0.1
