[project]
name = "oracle"
version = "0.1.0"
description = "Systematic Trading Intelligence Platform"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Alin Danut Chinaglia Rudaru" }]
license = { text = "MIT" }

dependencies = [
    "numpy<2.5",
    "pandas>=2.2",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "nats-py>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "langgraph>=0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "sse-starlette>=2.1",
    "ib-insync",
    "torch",
    "statsmodels>=0.14.6",
    "nautilus-trader>=1.230.0",
    "asyncpg>=0.31.0",
    "deap>=1.4.4",
    "vectorbt>=0.23.3",
    "ta-lib>=0.7.1",
    "lightgbm>=4.7.0",
    "ccxt>=4.5.64",
    "pyportfolioopt>=1.6.0",
    "purgedcv>=0.1.3",
    "deflated-sharpe",
    "simfin>=1.0.2",
    "transformers>=5.15.0",
    "feedparser>=6.0.14",
    "vix>=1.0.8",
]

[project.scripts]
oracle = "apps.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "ipython>=8.22",
    "ipdb>=0.13",
]

pybroker = [
    # NOTE: PyBroker is an INTERNAL-ONLY library; it is NOT on PyPI.
    # The list below mirrors a typical dev extra to make `uv sync
    # --extra pybroker` succeed in environments that have already
    # configured a private index pointing at lib-pybroker.
    # Without that index configured, the integration tests skip
    # gracefully (see tests/genetics/test_pybroker_integration.py).
    "ipdb>=0.13",
    "ipython>=8.22",
    "pre-commit>=3.6",
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

analytics = [
    "ta-lib>=0.5",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "statsmodels>=0.14",
    "arch>=6.3",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "hmmlearn>=0.3",
    "ruptures>=1.1",
    "httpx>=0.27",
    "yfinance>=0.1",
    "pyportfolioopt>=1.5",
    "vectorbt>=0.23.3",
]

genetics = [
    "deap>=1.4",
]

agents = [
    "langgraph>=0.1",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "litellm>=1.83",
]

execution = [
    "ccxt>=4.3",
    "ib_insync>=0.9",
    "nautilus-trader>=1.180",
    "asyncpg>=0.29",
]

dashboard = [
    "streamlit>=1.34",
    "plotly>=5.20",
]

research = [
    "xgboost>=2.0",
    "shap>=0.44",
    "bayesian-optimization>=1.4",
    "umap-learn>=0.5",
]

all = [
    "oracle[dev,analytics,genetics,agents,execution,dashboard,research]",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.conf"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF"]
# Audit-remediation-beta P1 cleanup: silence stylistic rules that
# would require touching large amounts of pre-existing code unrelated
# to the G5/G6 work.  Each suppressed rule has a documented reason.
#
# RUF001/002/003 (ambiguous-unicode) — we use ✓ → etc in docstrings
#   and comments.  The repo is py312-only, so no Python 2 ambiguity.
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF006",  # asyncio dangling task — pre-existing in core async paths
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Research-lane modules (Opzione C 2026-08): long lines are inside LLM prompt
# templates and literature citations — rewriting them alters prompt text.
"analytics/ai_analysts/*.py" = ["E501", "ARG002"]
"analytics/research/trial_ledger_alerts.py" = ["E501", "ARG001", "SIM113"]
"analytics/strategy/cta.py" = ["E501", "ARG002"]
"analytics/strategy/dystopian_stress.py" = ["E501"]
"analytics/strategy/catalog/value.py" = ["ARG004"]
"analytics/strategy/lane_d_vrp_backtest.py" = ["N806", "F841"]
"analytics/strategy/lane_d_vrp.py" = ["SIM105"]
# Opzione C research scripts (2026-08): long lines in prompts/report text,
# F401 imports are deliberate availability smoke checks.
"scripts/run_lane_a_validation.py" = ["E501"]
"scripts/run_ai_swarm.py" = ["E501"]
"scripts/run_ai_swarm_historical.py" = ["E501"]
"scripts/run_ai_swarm_batch.py" = ["E501"]
"scripts/run_bl024_g6_qualifying.py" = ["E501"]
"scripts/run_lane_b_backtest.py" = ["E501"]
"scripts/run_lane_b_composite_compare.py" = ["E501"]
"scripts/probe_long_prompt.py" = ["E501"]
"scripts/generate_alert_report.py" = ["E501"]
"scripts/register_thesis.py" = ["E501"]
"scripts/smoke_dsr_packages.py" = ["F401"]
"scripts/smoke_ibkr.py" = ["SIM105", "SIM108", "F841", "E501"]
"tests/unit/test_dystopian_stress.py" = ["ARG001"]
"tests/unit/test_edge_ensemble_v2.py" = ["B007"]
"tests/unit/test_ingestion_binance_vision.py" = ["ARG001", "ARG002"]
"tests/unit/test_lane_d_vrp_backtest.py" = ["C408"]
"tests/unit/test_trial_ledger.py" = ["RUF043"]
"tests/unit/test_composite_lane_b.py" = ["RUF043"]
"tests/unit/test_trial_ledger_alerts.py" = ["E501"]
"execution/brokers/ccxt_broker.py" = ["ARG001", "ARG002"]
"execution/brokers/ibkr.py" = ["ARG001", "ARG002"]
"genetics/signal/heikin_ashi.py" = ["F821"]
"analytics/backtest/pybroker_integration.py" = ["ARG001", "ARG002"]
"genetics/genome/knn_signal.py" = ["ARG002"]
"tests/execution/test_ibkr.py" = ["N802", "N803", "N815"]
"tests/execution/test_ccxt.py" = ["ARG001", "ARG002"]
"tests/fixtures/plugins/*.py" = ["RUF012"]
"tests/unit/test_plugin_system.py" = ["RUF012"]

"tests/genetics/test_alpha_library.py" = ["ARG002"]
"tests/genetics/test_fitness.py" = ["ARG002"]
"tests/genetics/test_islands.py" = ["ARG002"]
"tests/genetics/test_serialize.py" = ["ARG002"]
"showcase.py" = ["E402", "E501"]
# Audit-remediation-beta: these tests use many unused arguments on
# helpers and fixture methods that follow pytest's contract.
"tests/unit/test_realtime.py" = ["ARG001", "ARG002", "E501"]
"tests/unit/test_oms_postgres.py" = ["ARG001", "ARG002"]
"tests/unit/test_ledger_postgres.py" = ["ARG001", "ARG002"]
"tests/unit/test_contracts.py" = ["ARG001", "ARG002"]
"tests/unit/test_instruments.py" = ["ARG001", "ARG002"]
"tests/unit/test_auth.py" = ["ARG002", "RUF043"]
"tests/unit/test_metrics_freq_audit.py" = ["RUF043"]
"market/contracts.py" = ["ARG001", "ARG002"]
"market/sessions.py" = ["ARG001", "ARG002"]
"market/realtime.py" = ["ARG001"]
"core/oms_postgres.py" = ["ARG001", "ARG002", "E501"]
"core/ledger_postgres.py" = ["ARG001"]
"core/observability.py" = ["ARG001"]
"tests/policy/test_risk_property.py" = ["ARG001", "ARG002", "SIM103"]
"tests/unit/test_ledger_oms.py" = ["RUF043"]
"market/macro.py" = ["E501"]
"scripts/run_paper_session.py" = ["E501"]
"scripts/legacy/*.py" = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF"]  # noqa
# BL-301: sources/pipeline use a UTC alias pattern (UP017, E402) and class-level
# dicts (RUF012) that pre-date the ruff config. Suppressed to avoid touching
# unrelated pre-existing code.
"market/ingestion/sources.py" = ["E402", "UP017", "RUF012"]
"market/ingestion/pipeline.py" = ["E402", "UP017", "ARG002", "RUF005"]
"market/ingestion/orchestrator.py" = ["E402", "UP017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_return_any = true
warn_unused_configs = true

# Genetics code uses numpy ndarray patterns that trigger no-any-return
# across many files.  These are pre-existing and tracked separately.
[[tool.mypy.overrides]]
module = [
    "analytics.backtest.pybroker_integration",
]
ignore_errors = true

# ibkr.py needs `# type: ignore[no-untyped-call]` for the untyped ib_insync
# constructor; pre-commit mypy (without ib_insync stubs) flags it as unused.
[[tool.mypy.overrides]]
module = ["execution.brokers.ibkr"]
disable_error_code = ["unused-ignore"]

# market/realtime.py uses ib_insync (no type stubs available).  Without
# stubs mypy reports "IB has no attribute MarketDataType" and other
# untyped-call errors.  The runtime code works; we acknowledge the
# type-annotation gap and skip these errors until stubs ship.
[[tool.mypy.overrides]]
module = ["market.realtime"]
disable_error_code = ["no-untyped-call", "attr-defined", "assignment"]

# BL-301 ingestion layer — pre-existing annotation gaps in the UTC alias
# pattern, HttpSource mixin attrs, and bare dict/Iterator types.  These
# pre-date the strict mypy config and are tracked separately from the
# G6/R0-R5 work.
[[tool.mypy.overrides]]
module = [
    "market.ingestion.sources",
    "market.ingestion.pipeline",
    "market.ingestion.orchestrator",
    "market.ingestion.normalize",
    "market.ingestion.metadata_io",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests (skip with -m 'not slow')",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
source = ["oracle"]
branch = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "pass",
]

[tool.setuptools.packages.find]
include = ["application*", "core*", "market*", "analytics*", "execution*", "genetics*", "research*", "agents*", "audit*", "policy*", "orchestration*", "apps*"]
exclude = ["tests*"]

[tool.uv.sources]
deflated-sharpe = { git = "https://github.com/mnemox-ai/deflated-sharpe.git" }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "duckdb>=1.5.4",
    "hmmlearn>=0.3.3",
    "httpx>=0.28.1",
    "mypy>=2.2.0",
    "polars>=1.42.1",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "ruptures>=1.1.10",
    "websockets>=15.0.1",
    "yfinance>=1.5.1"
]
genetics = [
    "deap>=1.4.4"
]
