[project]
name = "oracle"
version = "0.1.0"
description = "Systematic Trading Intelligence Platform"
requires-python = ">=3.12"
authors = [{ name = "Oracle Team" }]
license = { text = "MIT" }

dependencies = [
    "numpy<2.5",
    "pandas>=2.2",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "nats-py>=2.8",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "langgraph>=0.1",
    "langchain-community>=0.2",
]

[project.scripts]
oracle = "apps.cli.main:main"

[project.optional-dependencies]
dev = []

pybroker = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "ipython>=8.22",
    "ipdb>=0.13",
]

analytics = [
    "ta-lib>=0.5",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "arch>=6.3",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "hmmlearn>=0.3",
    "ruptures>=1.1",
    "httpx>=0.27",
    "yfinance>=0.1",
    "pyportfolioopt>=1.5",
    "vectorbt>=0.23.3",
]

genetics = [
    "deap>=1.4",
]

agents = [
    "langgraph>=0.1",
    "langchain>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "litellm>=1.83",
]

execution = [
    "ccxt>=4.3",
    "ib_insync>=0.9",
    "nautilus-trader>=1.180",
    "asyncpg>=0.29",
]

dashboard = [
    "streamlit>=1.34",
    "plotly>=5.20",
]

research = [
    "xgboost>=2.0",
    "shap>=0.44",
    "bayesian-optimization>=1.4",
    "umap-learn>=0.5",
]

all = [
    "oracle[dev,analytics,genetics,agents,execution,dashboard,research]",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/execution/test_ibkr.py" = ["N802", "N803", "N815"]
"tests/execution/test_ccxt.py" = ["ARG001", "ARG002"]
"tests/fixtures/plugins/*.py" = ["RUF012"]
"tests/unit/test_plugin_system.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests (skip with -m 'not slow')",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
source = ["oracle"]
branch = true

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "pass",
]

[tool.setuptools.packages.find]
include = ["core*", "market*", "analytics*", "execution*", "genetics*", "research*", "agents*", "audit*", "policy*", "orchestration*"]
exclude = ["tests*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "duckdb>=1.5.4",
    "hmmlearn>=0.3.3",
    "httpx>=0.28.1",
    "mypy>=2.2.0",
    "polars>=1.42.1",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "ruptures>=1.1.10",
    "websockets>=15.0.1",
    "yfinance>=1.5.1"
]
genetics = [
    "deap>=1.4.4"
]
